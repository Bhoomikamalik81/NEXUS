<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXORA</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0B0F14;
            color: #E8EDF2;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .container {
            max-width: 1180px;
            margin: auto;
            padding: 0 32px;
        }

        /* Navigation */

        header {
            border-bottom: 1px solid #252c35;
        }

        .nav {
            height: 72px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 1.1rem;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            gap: 30px;
        }

        .nav-links a {
            color: #AEB9C4;
        }

        .register-btn {
            background: #E8352B;
            color: #0B0F14;
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: bold;
        }

        /* Sections */

        section {
            min-height: 300px;
            padding: 80px 0;
        }

        .hero {
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .hero h1 {
            font-size: 5rem;
            margin-bottom: 20px;
        }

        .hero p {
            max-width: 600px;
            margin: auto;
            color: #AEB9C4;
        }

        footer {
            border-top: 1px solid #252c35;
            padding: 40px 0;
        }
    </style>
</head>
<body>

    <!-- Navigation -->

    <header>
        <div class="container nav">
            <div class="logo">
                NEXORA
            </div>

            <nav class="nav-links">
                <a href="#overview">Overview</a>
                <a href="#mentors">Mentors</a>
                <a href="#agenda">Agenda</a>
                <a href="#domains">Domains</a>
            </nav>

            <a href="#register" class="register-btn">
                Register
            </a>
        </div>
    </header>

    <!-- Hero -->

    <section class="hero">
        <div class="container">
            <h1>NEXORA</h1>
            <p>
                A beginner-friendly technology workshop designed to help students explore different technology domains from the basics.
            </p>
        </div>
    </section>

    <!-- Overview -->

    <section id="overview">
        <div class="container">
            <h2>Overview</h2>
        </div>
    </section>

    <!-- Mentors -->

    <section id="mentors">
        <div class="container">
            <h2>Mentors</h2>
        </div>
    </section>

    <!-- Agenda -->

    <section id="agenda">
        <div class="container">
            <h2>Agenda</h2>
        </div>
    </section>

    <!-- Domains -->

    <section id="domains">
        <div class="container">
            <h2>Domains</h2>
        </div>
    </section>

    <!-- Registration -->

    <section id="register">
        <div class="container">
            <h2>Register for NEXORA</h2>
        </div>
    </section>

    <!-- Footer -->

    <footer>
        <div class="container">
            NEXORA
        </div>
    </footer>

</body>
</html>
